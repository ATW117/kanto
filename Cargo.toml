[workspace]
resolver = "2"
members = ["crates/pkmn-sys", "crates/battle-env", "crates/pokemon-env-py", "crates/sim-core", "crates/sim-data", "crates/sim-gen1", "crates/sim-backend", "crates/sim-parity"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.bench]
inherits = "release"
