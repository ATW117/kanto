[package]
name = "sim-parity"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parity harness: differential testing of the native simulator against Pokémon Showdown (and pkmn/engine)."

[[bin]]
name = "parity"
path = "src/main.rs"

[dependencies]
sim-core = { path = "../sim-core", features = ["trace"] }
sim-data = { path = "../sim-data" }
sim-gen1 = { path = "../sim-gen1", features = ["trace"] }
sim-backend = { path = "../sim-backend" }
pkmn-sys = { path = "../pkmn-sys" }
battle-env = { path = "../battle-env" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
