[package]
name = "kanto-env"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pkmn-sys = { path = "../pkmn-sys", optional = true }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# The pkmn/engine backend (`Pkmn1`). Builds libpkmn from third_party/pkmn-engine with Zig 0.16.
pkmn = ["dep:pkmn-sys"]

[dev-dependencies]

[[test]]
name = "env"
path = "../../tests/rust/env.rs"
required-features = ["pkmn"]
