# kanto-py is a Python extension module: on macOS its Python symbols resolve at import time, so
# plain `cargo build` needs the linker to allow them undefined (maturin passes this itself).
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]
