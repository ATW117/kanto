[workspace]
resolver = "2"
members = ["crates/pkmn-sys", "crates/kanto-env", "crates/kanto-py", "crates/kanto-core", "crates/kanto-data", "crates/kanto-gen1", "crates/kanto-backend", "crates/kanto-parity"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.bench]
inherits = "release"
