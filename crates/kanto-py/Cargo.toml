[package]
name = "kanto-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_kanto"
crate-type = ["cdylib"]

[features]
# backend="pkmn": pkmn/engine via libpkmn (needs Zig 0.16 and the third_party/pkmn-engine submodule).
pkmn = ["kanto-env/pkmn"]

[dependencies]
kanto-env = { path = "../kanto-env" }
kanto-backend = { path = "../kanto-backend" }
kanto-core = { path = "../kanto-core" }
kanto-gen1 = { path = "../kanto-gen1" }
numpy = "0.29.0"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
