[workspace]
resolver = "2"
members = [
    "crates/kanto-core",
    "crates/kanto-data",
    "crates/kanto-gen1",
    "crates/kanto-env",
    "crates/kanto-backend",
    "crates/kanto-parity",
    "crates/kanto-py",
    "crates/pkmn-sys",
]
# pkmn-sys (the optional pkmn/engine backend) needs Zig 0.16 and the submodule, so plain `cargo
# build` / `cargo test` leave it out. `cargo test --workspace --all-features` includes it.
default-members = [
    "crates/kanto-core",
    "crates/kanto-data",
    "crates/kanto-gen1",
    "crates/kanto-env",
    "crates/kanto-backend",
    "crates/kanto-parity",
    "crates/kanto-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ATW117/kanto"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.bench]
inherits = "release"
